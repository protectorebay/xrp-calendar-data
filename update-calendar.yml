name: Update economic calendar

on:
  schedule:
    - cron: '17 */3 * * *'     # every 3 hours (UTC)
  workflow_dispatch:            # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch calendar and rebuild events.json
        run: node scripts/update_calendar.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- events.json && git ls-files --error-unmatch events.json >/dev/null 2>&1; then
            echo "events.json unchanged"
            exit 0
          fi
          git config user.name  "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add events.json
          git commit -m "Update economic calendar"
          git push
